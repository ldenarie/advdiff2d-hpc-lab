name: Benchmark

# Run manually from the Actions tab: benchmarks are slow and noisy, and only
# results from one run (one machine) should be compared with each other.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Grid sizes n (n x n)"
        default: "128 512 2048 4096"
      kernels:
        description: "Sequential kernels (run once, 1 thread)"
        default: "naive weighted incremental"
      parallel_kernels:
        description: "Parallel kernels (run for each thread count)"
        default: "omp"
      threads:
        description: "OMP_NUM_THREADS values for the parallel kernels"
        default: "1 2 3 4"
      baseline:
        description: "Sequential kernel used as the reference for speedups"
        default: "incremental"
      reps:
        description: "Timed repetitions per configuration"
        default: "7"

jobs:
  bench:
    runs-on: ubuntu-24.04
    env:
      SIZES: ${{ inputs.sizes }}
      KERNELS: ${{ inputs.kernels }}
      PARALLEL_KERNELS: ${{ inputs.parallel_kernels }}
      THREADS: ${{ inputs.threads }}
      BASELINE: ${{ inputs.baseline }}
      REPS: ${{ inputs.reps }}
      # Fixed thread placement, so that runs are comparable: threads are packed
      # onto cores (2 hardware threads per core on these runners).
      OMP_PROC_BIND: close
      OMP_PLACES: cores
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build python3-matplotlib

      - name: Build (Release, no tests)
        run: |
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DADVDIFF_BUILD_TESTS=OFF
          cmake --build build-release

      - name: Run benchmarks
        id: run
        run: |
          out_dir=$(bench/run_bench.sh -b build-release -l gha-ubuntu-24.04 \
                      -s "$SIZES" -k "$KERNELS" -p "$PARALLEL_KERNELS" \
                      -t "$THREADS" -r "$REPS")
          echo "out_dir=$out_dir" >> "$GITHUB_OUTPUT"

      - name: Plot and summarize
        env:
          OUT_DIR: ${{ steps.run.outputs.out_dir }}
        run: |
          python3 bench/plot.py size "$OUT_DIR/raw.csv"
          if [ -n "$PARALLEL_KERNELS" ] && [ "$(wc -w <<< "$THREADS")" -gt 1 ]; then
            python3 bench/plot.py threads "$OUT_DIR/raw.csv"
            if [ -n "$BASELINE" ]; then
              python3 bench/plot.py threads "$OUT_DIR/raw.csv" --baseline "$BASELINE"
            fi
          fi
          cat "$OUT_DIR"/summary_*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: results/
